[project]
name = "zhtw-pii"
version = "0.1.0"
description = "Traditional Chinese PII and sensitive-entity detector, benchmarked and runnable in-browser."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bo-Yu Chen" }]
requires-python = "==3.11.*"
dependencies = [
    "pydantic-settings==2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zhtw_pii"]

[dependency-groups]
# Heavy, optional dependencies for the benchmark's Presidio, GLiNER2-PII,
# and Claude Haiku baselines. `uv sync` (no --group) never installs these;
# `uv sync --group benchmark` does. All exact-pinned: this group is not
# installed in CI (see ci.yml's lint/test jobs), so nothing here re-resolves
# on a schedule the way the main and dev groups implicitly do.
benchmark = [
    "anthropic==1.4.0",
    "gliner2[local]==2.0.0",
    "presidio-analyzer==2.2.364",
    "protobuf==7.36.1",
    "spacy==3.8.16",
    "zh-core-web-lg==3.8.0",
]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.ruff]
line-length = 100
# Spikes are self-contained experiments with their own environments; see spikes/README.md.
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "basic"
exclude = ["spikes", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, no network, no filesystem outside tmp_path",
    "integration: needs a real model or external process",
    "slow: takes more than a few seconds",
]
addopts = "-m unit"

[tool.uv.sources]
zh-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/zh_core_web_lg-3.8.0/zh_core_web_lg-3.8.0-py3-none-any.whl" }
