<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>S1 browser budget harness</title>
</head>
<body>
<p>S1 browser model size budget harness. Driven by Playwright via <code>window.runBenchmark(cfg)</code>; not meant to be used interactively.</p>
<script type="module">
import { pipeline, env } from "./vendor/transformers.min.js";

// Avoid CDN variance for the ONNX runtime WASM binary: point at the copy
// vendored from node_modules/onnxruntime-web (see ../.gitignore for the
// regeneration command). This is the "asyncify" build, the one
// transformers.js selects by default for non-Safari browsers.
env.backends.onnx.wasm.wasmPaths = {
  wasm: "./vendor/ort-wasm-simd-threaded.asyncify.wasm",
  mjs: "./vendor/ort-wasm-simd-threaded.asyncify.mjs",
};

/**
 * @typedef {Object} BenchConfig
 * @property {string} modelId - Local model directory name (source="local") or HF Hub repo id (source="remote").
 * @property {"token-classification"|"feature-extraction"} task
 * @property {"fp32"|"q8"} dtype
 * @property {"local"|"remote"} source
 * @property {string[]} sentences - Up to 100 sentences for the per-sentence latency loop.
 */

/**
 * Load one model, run a warmup inference, then time a sentence loop.
 * Returns a JSON-serializable result; never throws (errors are captured
 * in the returned object) so a single failing config does not abort the
 * Playwright run driving this page.
 * @param {BenchConfig} cfg
 */
window.runBenchmark = async (cfg) => {
  const result = {
    modelId: cfg.modelId,
    task: cfg.task,
    dtype: cfg.dtype,
    source: cfg.source,
    webgpu_available: typeof navigator !== "undefined" && "gpu" in navigator,
    shared_array_buffer_available: typeof SharedArrayBuffer !== "undefined",
  };

  try {
    if (cfg.source === "local") {
      env.allowLocalModels = true;
      env.localModelPath = "/models/";
      env.allowRemoteModels = false;
    } else {
      env.allowLocalModels = false;
      env.allowRemoteModels = true;
    }

    const t0 = performance.now();
    const pipe = await pipeline(cfg.task, cfg.modelId, {
      dtype: cfg.dtype,
      device: "wasm",
    });
    const t1 = performance.now();
    result.cold_load_ms = t1 - t0;

    const warmupText = cfg.sentences[0] ?? "測試";
    const w0 = performance.now();
    await pipe(warmupText);
    const w1 = performance.now();
    result.first_inference_ms = w1 - w0;

    const latenciesMs = [];
    for (const text of cfg.sentences) {
      const s0 = performance.now();
      await pipe(text);
      const s1 = performance.now();
      latenciesMs.push(s1 - s0);
    }
    result.latencies_ms = latenciesMs;
    result.sentence_count = cfg.sentences.length;

    // Cross-check actual bytes transferred for this page load against the
    // known file sizes on disk (catches silent proxy re-compression, HTTP
    // caching we did not intend, or a wrong dtype/file being fetched).
    result.resource_timings = performance
      .getEntriesByType("resource")
      .filter((e) => e.name.includes(".onnx") || e.name.includes(".wasm"))
      .map((e) => ({
        name: e.name,
        transferSize: e.transferSize,
        encodedBodySize: e.encodedBodySize,
        decodedBodySize: e.decodedBodySize,
        duration: e.duration,
      }));

    if (performance.memory) {
      result.js_heap_used_bytes = performance.memory.usedJSHeapSize;
      result.js_heap_total_bytes = performance.memory.totalJSHeapSize;
    }
  } catch (err) {
    result.error = String(err && err.stack ? err.stack : err);
  }

  return result;
};

window.__harnessReady = true;
</script>
</body>
</html>
